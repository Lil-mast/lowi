services:
  - type: web
    name: lowi-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: AGENTROUTER_API_KEY
        sync: false
      - key: AGENTROUTER_BASE_URL
        value: https://agentrouter.org/v1
      - key: AGENTROUTER_SUMMARY_MODEL
        value: claude-opus-4-8
      - key: AGENTROUTER_PREP_MODEL
        value: deepseek-v4-flash
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false

  - type: web
    name: lowi-ui
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh -c "streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false"
    envVars:
      - key: LOWI_API_URL
        sync: false
