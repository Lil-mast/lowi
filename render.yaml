services:
  - type: redis
    name: lowi-redis
    plan: free
    ipAllowList: []

  - type: web
    name: lowi-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: AGENTROUTER_API_KEY
        sync: false
      - key: AGENTROUTER_BASE_URL
        value: https://agentrouter.org/v1
      - key: AGENTROUTER_SUMMARY_MODEL
        value: claude-opus-4-8
      - key: AGENTROUTER_PREP_MODEL
        value: deepseek-v4-flash
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JOB_BACKEND
        value: arq
      - key: REDIS_URL
        fromService:
          name: lowi-redis
          type: redis
          property: connectionString
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "500"
      - key: AUTH_MODE
        value: neon
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false
      - key: NEON_AUTH_ISSUER
        sync: false
      - key: NEON_AUTH_AUDIENCE
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: UI_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false

  - type: worker
    name: lowi-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: arq app.workers.tasks.WorkerSettings
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: AGENTROUTER_API_KEY
        sync: false
      - key: AGENTROUTER_BASE_URL
        value: https://agentrouter.org/v1
      - key: AGENTROUTER_SUMMARY_MODEL
        value: claude-opus-4-8
      - key: AGENTROUTER_PREP_MODEL
        value: deepseek-v4-flash
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JOB_BACKEND
        value: arq
      - key: REDIS_URL
        fromService:
          name: lowi-redis
          type: redis
          property: connectionString
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: AUTH_MODE
        value: neon
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: UI_BASE_URL
        sync: false

  - type: web
    name: lowi-ui
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh -c "streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true"
    envVars:
      - key: LOWI_API_URL
        sync: false
