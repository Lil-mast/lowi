[project]
name = "lowi"
version = "0.1.0"
description = "Meeting intelligence agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "arq",
    "elevenlabs",
    "fastapi",
    "google-api-python-client>=2.200.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "httpx>=0.28.1",
    "openai",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings",
    "python-multipart",
    "sqlalchemy",
    "uvicorn[standard]",
    "weasyprint",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]
frontend = [
    "streamlit",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
# FastAPI uses Depends() in argument defaults.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
